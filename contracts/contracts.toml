# Contract-test manifest, checked by `cargo xtask contract-check` (`just contracts-verify`,
# CI). Workflow: contracts/CLAUDE.md.
#
# - HEAD's copy pins each feature's version: the annotated tag contract/<feature>/v<version>
#   must exist (`just contract-pin`). Signatures are off for now; `--require-signatures`
#   would also need it signed by a key in the base branch's .github/contract-signers.
# - The file set of a version comes from the manifest inside its tag, so editing `paths`
#   here changes nothing until a new version is pinned.
# - Versions only go up. To change a contract, bump its version, then edit its files.

# Every file matching one of these is a contract file and must be covered by a contract tag.
# The base branch's globs apply too, so removing a glob here hides nothing.
contract_globs = [
  "**/tests/contract_*.rs",
  "**/tests/contract_*/**",
  "**/*.contract.test.ts",
  "**/*.contract.test.tsx",
  "**/*.contract.spec.ts",
  "frontend/e2e/contract/**",
]

# GET /health answers 200 with {"status":"ok","version":"<vak-api version>"}.
[features.health]
version = 1
paths = ["backend/crates/api/tests/contract_health.rs"]

# The dev-only model shim serves the Databricks STT/TTS invocation shapes (the two serving
# schemas, pinned here too) and forwards them to mlx-audio, with Databricks-shaped errors.
[features.model-shim]
version = 1
paths = [
  "backend/apps/model-shim/tests/contract_model_shim.rs",
  "contracts/serving/stt.json",
  "contracts/serving/tts.json",
]

# M2 Provision: create an agent with only name, purpose and voice (defaults for the rest),
# list, get, autosave edits, archive, 25 % setup progress, forwarded identity, audit events;
# end to end against the real server and Postgres.
[features.agent-provisioning]
version = 1
paths = [
  "backend/crates/domain/tests/contract_agent_provisioning.rs",
  "backend/crates/api/tests/contract_agent_provisioning_api.rs",
  "frontend/e2e/contract/agent-provisioning/**",
]

# M4a Voice core: the vak.media.v1 protocol (schema and examples, checked by the server's types
# and the browser's parser); the pipeline in simulated time (locked disclosure first, barge-in
# within one frame that cancels the LLM, turn order, per-stage timings); the three-layer
# opt-out, which a decision timeout never suppresses; and the four model adapters, each passing
# its port's shared conformance suite against wiremock and, in ignored live tests, the local
# servers. The suites, the shared pipeline test setup and the recorded fixtures are pinned too.
[features.voice-core]
version = 1
paths = [
  "contracts/media/vak.media.v1.json",
  "contracts/media/examples.json",
  "backend/crates/providers/tests/contract_voice_core_media.rs",
  "backend/crates/pipeline/tests/contract_voice_core_pipeline.rs",
  "backend/crates/pipeline/tests/contract_voice_core_opt_out.rs",
  "backend/crates/pipeline/tests/contract_voice_core/**",
  "backend/crates/testkit/src/conformance.rs",
  "backend/crates/testkit/src/conformance/**",
  "backend/crates/adapters/stt-serving/tests/contract_voice_core_stt.rs",
  "backend/crates/adapters/tts-serving/tests/contract_voice_core_tts.rs",
  "backend/crates/adapters/llm-openai/tests/contract_voice_core_llm.rs",
  "backend/crates/adapters/decision-systemone/tests/contract_voice_core_decisions.rs",
  "backend/fixtures/audio/utterance_book_table_16k.wav",
  "backend/fixtures/audio/utterance_book_table_16k.txt",
  "backend/fixtures/llm/text_reply.sse",
  "backend/fixtures/llm/tool_call.sse",
  "frontend/src/shared/voice/media-protocol.contract.test.ts",
]

# Opt-out confirm band (after the first live test call): a decision score from 0.3 up to the
# 0.8 end threshold makes the agent ask a fixed check question instead of ending the call; a
# clear yes to it ends the call with the locked confirmation, anything else carries on. The
# phrase list, the LLM tool and a score of 0.8 or more still end the call at once. In the
# voice-core simulation (its shared setup is reused, pinned by voice-core).
[features.opt-out-confirm]
version = 1
paths = ["backend/crates/pipeline/tests/contract_opt_out_confirm.rs"]

# The app shell (navigation, layout, landing on Agents) and the shared Button.
[features.app-shell]
version = 1
paths = [
  "frontend/e2e/contract/app-shell/**",
  "frontend/src/shared/ui/button.contract.test.tsx",
]

# M3 Plan: the plan graph and its located validation errors (property-based), a valid template
# per use case, versioned rule packs (the version 1 pack files are pinned too, so a published
# pack never changes), GET/PUT /agents/{id}/plan and POST …/plan/validate, 50 % setup progress
# for a saved valid plan, and the keyboard flow editor end to end against the real server.
[features.plan]
version = 1
paths = [
  "backend/crates/domain/tests/contract_plan.rs",
  "backend/crates/services/tests/contract_plan_rule_packs.rs",
  "backend/crates/api/tests/contract_plan_api.rs",
  "frontend/e2e/contract/plan/**",
  "contracts/rule-packs/*.v1.toml",
]

# The agent's page as a workspace that fits the screen (frontend only): at 1280×800, 1440×900
# and 1920×1080 the document never scrolls, with the settings, setup progress, "Start test
# call" and the transcript in view, settings beside the transcript; the transcript orders lines
# by turn, not arrival, follows the newest line in its own scroll region and offers "Jump to
# latest" when scrolled up; a call ends on why it ended. End to end against the real server,
# with only the voice call faked (session start and media socket).
[features.agent-workspace]
version = 1
paths = ["frontend/e2e/contract/agent-workspace/**"]
