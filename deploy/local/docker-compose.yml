# Postgres 18 for local development (Lakebase in production). Only Postgres runs in Docker:
# the models run natively, since containers on macOS get no Metal GPU.
# `just db-up` starts it; `just dev` runs it under process-compose. Settings come from .env
# through deploy/local/env.sh: VAK_PG_PORT (host port, default 5433) and VAK_PG_PASSWORD.
name: vak-local

services:
  db:
    # postgres:18.6-trixie, pinned by digest (multi-arch index). Dependabot bumps it.
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: vak
      POSTGRES_DB: vak
      POSTGRES_PASSWORD: ${VAK_PG_PASSWORD:?set VAK_PG_PASSWORD in .env (see .env.example)}
    ports:
      # Loopback only: the database is never reachable from the LAN.
      - "127.0.0.1:${VAK_PG_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep PGDATA in a versioned folder under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=vak", "--dbname=vak", "--host=127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s

volumes:
  pgdata:
