# cargo-deny policy: advisories, licenses, bans and sources. Run with `cargo deny check`
# from backend/ (part of `just backend-verify`). Owner-reviewed (CODEOWNERS).

[graph]
# Platforms we build for: macOS dev machines and Linux on Databricks Apps (the CPU
# architecture is settled in spike S1). Windows-only crates are out of scope.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Vulnerability and unsound advisories always fail. Every `ignore` entry needs a reason
# and an expiry date in the reason.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing this Apache-2.0 project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: entries may be unused today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Duplicates that come from inside one dependency and that we can't unify from here. Each
# entry names its source; revisit them on every bump of that dependency (review by
# 2027-04-30 at the latest).
skip = [
  # sqlx 0.9.0: sqlx-core (migration checksums) uses the sha2 0.10 generation, sqlx-postgres
  # (SCRAM auth) sha2 0.11. Both are only in vak-repositories-pg.
  { crate = "sha2@0.10.9", reason = "sqlx-core 0.9.0 pins sha2 0.10; sqlx-postgres uses 0.11" },
  { crate = "digest@0.10.7", reason = "sha2 0.10 via sqlx-core 0.9.0" },
  { crate = "block-buffer@0.10.4", reason = "sha2 0.10 via sqlx-core 0.9.0" },
  { crate = "crypto-common@0.1.6", reason = "sha2 0.10 via sqlx-core 0.9.0" },
  { crate = "cpufeatures@0.2.17", reason = "sha2 0.10 via sqlx-core 0.9.0" },
  # sqlx-core 0.9.0's hashlink pins hashbrown 0.16; indexmap uses 0.17.
  { crate = "hashbrown@0.16.1", reason = "hashlink 0.11 via sqlx-core 0.9.0" },
  # sqlx-macros 0.9.0 and tracing-attributes 0.1.31 (enabled by sqlx-core) still use syn 2;
  # everything else uses syn 3. Compile-time only.
  { crate = "syn@2.0.119", reason = "proc macros of sqlx 0.9.0 and tracing-attributes 0.1.31" },
]
# Framework firewall: only the named crates may depend on these directly (research 02,
# "Enforcement"). Wrappers are declared before their crates use the banned crate, so the
# policy is fixed up front; until then cargo-deny prints `unused-wrapper` warnings. Those
# warnings don't fail the check, and cargo-deny 0.20 has no setting to silence them.
deny = [
  { crate = "sqlx", wrappers = [
    "vak-repositories-pg",
    "apalis-postgres",
    # jiff Timestamp <-> timestamptz; used only by vak-repositories-pg.
    "jiff-sqlx",
  ], reason = "persistence lives only in vak-repositories-pg" },
  { crate = "axum", wrappers = [
    "vak-api",
    "vak-server",
    "vak-model-shim",
    "utoipa-axum",
    "axum-extra",
  ], reason = "HTTP serving lives only in vak-api (and the binaries that serve it)" },
  { crate = "reqwest", wrappers = [
    "vak-adapter-llm-openai",
    "vak-adapter-stt-serving",
    "vak-adapter-tts-serving",
    "vak-adapter-decision-systemone",
    "vak-databricks-auth",
    "vak-model-shim",
  ], reason = "outbound HTTP lives only in adapters and databricks-auth" },
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]

[bans.workspace-dependencies]
# Versions are declared once, in [workspace.dependencies].
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
# crates.io only. No git or alternative registries without an explicit, reviewed entry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
