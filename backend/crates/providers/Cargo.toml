[package]
name = "vak-providers"
description = "Model and transport ports (traits) for LLM, STT, TTS, decisions and media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# Media events to and from JSON text frames, one encoding for the bridge and the fakes.
serde_json = { workspace = true }
thiserror = { workspace = true }
# Channel types of the media transport handle (`sync` only: no runtime, no I/O).
tokio = { workspace = true, features = ["sync"] }
vak-audio = { workspace = true }
vak-domain = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
