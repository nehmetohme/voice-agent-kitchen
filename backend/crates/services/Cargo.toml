[package]
name = "vak-services"
description = "Use cases: agents, plans, versions and publish, test runs, sessions, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { workspace = true }
# Rule packs: contracts/rule-packs/*.toml, embedded at build time and parsed at startup.
serde = { workspace = true }
thiserror = { workspace = true }
# Test runs: the worker plays scenarios as tasks (`JoinSet`), waits for queued runs (`Notify`)
# and stops a cancelled run (`CancellationToken`).
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
# Test runs log their lifecycle: IDs, counts and statuses, never transcripts.
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
vak-domain = { workspace = true }
vak-pipeline = { workspace = true }
vak-providers = { workspace = true }
vak-repositories = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
vak-testkit = { workspace = true }

[lints]
workspace = true
