[package]
name = "vak-api"
description = "HTTP and WebSocket API: axum routers, DTOs, validation, problem+json errors, OpenAPI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `ws`: the media WebSocket.
axum = { workspace = true, features = ["ws"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["time"] }
vak-domain = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
vak-services = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
vak-testkit = { workspace = true }

[lints]
workspace = true
