[package]
name = "vak-adapter-decision-systemone"
description = "DecisionEngine adapter for the System One API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Plain HTTP for now (local llama-server); TLS comes with the Databricks deployment (M7).
reqwest = { workspace = true, features = ["json"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
vak-domain = { workspace = true }
vak-providers = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
vak-testkit = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
