[package]
name = "vak-server"
description = "Voice Agent Kitchen server binary (composition root)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vak-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
vak-api = { workspace = true }
vak-config = { workspace = true }
vak-telemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "sync", "time"] }

[lints]
workspace = true
