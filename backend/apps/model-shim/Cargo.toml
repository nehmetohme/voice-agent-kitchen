[package]
name = "vak-model-shim"
description = "Dev-only shim that serves Databricks STT/TTS shapes from local models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vak-model-shim"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
# No TLS: the shim only talks to mlx-audio over plain HTTP on this machine.
reqwest = { workspace = true, features = ["json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tracing = { workspace = true }
vak-telemetry = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }
tower = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
