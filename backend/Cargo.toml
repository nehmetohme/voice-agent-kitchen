# Voice Agent Kitchen backend: virtual workspace manifest.
# Layer rules: layers.toml (checked by `cargo xtask check-layers`). Bans: deny.toml.
[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/audio",
  "crates/providers",
  "crates/repositories",
  "crates/repositories-pg",
  "crates/adapters/llm-openai",
  "crates/adapters/stt-serving",
  "crates/adapters/tts-serving",
  "crates/adapters/decision-systemone",
  "crates/databricks-auth",
  "crates/pipeline",
  "crates/services",
  "crates/api",
  "crates/config",
  "crates/telemetry",
  "crates/testkit",
  "crates/contract-tests",
  "apps/server",
  "apps/model-shim",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Equals the pinned toolchain (rust-toolchain.toml); resolver 3 then prefers compatible deps.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/nehmetohme/voice-agent-kitchen"
publish = false

# Every version is declared once, here. Members use `{ workspace = true }`.
# Add an entry only together with the first crate that uses it (cargo-shear and
# cargo-deny reject unused workspace dependencies).
[workspace.dependencies]
# Internal crates
vak-adapter-decision-systemone = { path = "crates/adapters/decision-systemone" }
vak-adapter-llm-openai = { path = "crates/adapters/llm-openai" }
vak-adapter-stt-serving = { path = "crates/adapters/stt-serving" }
vak-adapter-tts-serving = { path = "crates/adapters/tts-serving" }
vak-api = { path = "crates/api" }
vak-audio = { path = "crates/audio" }
vak-config = { path = "crates/config" }
vak-domain = { path = "crates/domain" }
vak-pipeline = { path = "crates/pipeline" }
vak-providers = { path = "crates/providers" }
vak-repositories = { path = "crates/repositories" }
vak-repositories-pg = { path = "crates/repositories-pg" }
vak-services = { path = "crates/services" }
vak-telemetry = { path = "crates/telemetry" }
vak-testkit = { path = "crates/testkit" }

# External crates
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "tracing",
] }
base64 = "0.23.1"
# BytesMut: the media bridge reuses one buffer for every outbound audio frame. Already in the
# tree through axum and hyper.
bytes = { version = "1.12.1", default-features = false }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# Dev-only: the WebSocket client side in vak-api's media socket test.
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
] }
http-body-util = "0.1.5"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# sqlx has no jiff feature; jiff-sqlx maps Timestamp to timestamptz.
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
# jsonschema and reqwest are dev-only (vak-model-shim contract tests), like wiremock below.
# Their dev graph brings syn 2 (strum_macros, zerocopy-derive) and base64 0.22 (wiremock).
# sqlx 0.9.0 uses both in the normal graph as well, so deny.toml's `skip` list names them.
jsonschema = { version = "0.60.2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
# RustCrypto SHA-256 for the draft content hash (vak-domain); 0.11 is the generation
# sqlx-postgres already uses.
sha2 = { version = "0.11.1", default-features = false }
serde_json = "1.0.154"
# Postgres only, tokio runtime, compile-time checked queries (offline cache in
# crates/repositories-pg/.sqlx), embedded migrations. Only vak-repositories-pg uses it.
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2.0.21"
# >= 1.54.1: RUSTSEC-2026-0384 (use-after-free in `Interval`) affects 1.54.0.
tokio = { version = "1.54.1", default-features = false }
toml = "1.1.8"
# Dev-only: a WebSocket client for vak-api's media socket test; the version axum 0.8.9 uses.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = [
  "connect",
] }
# CancellationToken: barge-in and opt-out cancel a session's model calls in flight.
tokio-util = { version = "0.7.20", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# No `attributes` feature: tracing-attributes 0.1.31 still uses syn 2, everything else syn 3
# (cargo-deny multiple-versions). Revisit when #[instrument] is needed.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }
# Code-first OpenAPI 3.1 (research 02 §4). Only vak-api uses them.
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", default-features = false, features = ["std"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes_without_reason = "deny"
large_futures = "warn"
# Audio math: force explicit, documented casts.
cast_possible_truncation = "warn"
