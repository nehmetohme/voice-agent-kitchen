# A pinned contract test is weakened in place. contract-check fails even in the local
# --allow-pending mode: only findings awaiting a contract tag are allowed there, never a
# change to a pinned file. Signatures play no part: the default checker ignores them.
gate=contract-check --allow-pending (just contracts-verify-fast)
violation=one assertion in contract_health.rs (pinned by contract/health/v1) is loosened
command=just contracts-verify-fast
expect=contract-check: error: backend/crates/api/tests/contract_health\.rs changed since contract/health/v[0-9]+
