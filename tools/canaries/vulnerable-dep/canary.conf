# A dependency version with a RUSTSEC vulnerability advisory: protobuf 2.28.0,
# RUSTSEC-2024-0437 (crash through uncontrolled recursion). `expect` matches cargo-deny's own
# line, so cargo audit, which runs after it in backend-verify and flags the same advisory,
# can't stand in for it.
gate=cargo deny check advisories (just backend-verify)
violation=vak-audio depends on protobuf 2.28.0
command=just backend-verify
expect=error\[vulnerability\]: Crash due to uncontrolled recursion in protobuf crate
