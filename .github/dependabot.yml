# Dependabot version updates: weekly, grouped, with a cooldown so brand-new releases (the usual
# window for a hijacked package) wait before they are proposed. Security updates are turned on
# in the repo settings, skip the cooldown and are grouped separately.
# Not covered: tools pinned in .github/actions/install-release-bin callers (gitleaks,
# actionlint) and the trufflehog image digest; bump those by hand (docs/ci.md).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Also covers pnpm (frontend/pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # @types/node must match the Node major pinned in frontend/package.json `devEngines`
      # (24.x). Bump it by hand together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Bumps the pinned SHA together with its `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Dockerfiles under deploy/. None yet; they may arrive with the Databricks bundle (M7).
  - package-ecosystem: docker
    directories: ["/deploy/**"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Compose files are a separate ecosystem: the local Postgres image, pinned by tag and digest.
  - package-ecosystem: docker-compose
    directory: /deploy/local
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
