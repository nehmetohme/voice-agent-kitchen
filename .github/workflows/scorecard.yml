# OpenSSF Scorecard: publishes results to the public Scorecard API and code scanning.
# Publishing restricts this workflow: no workflow- or job-level `env`/`defaults`, no write
# permissions at workflow level, and the job may only use checkout, upload-artifact,
# codeql-action/upload-sarif, harden-runner and scorecard-action.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # workflow runs, for the CI-Tests and Dangerous-Workflow checks
      security-events: write # upload the SARIF to code scanning
      id-token: write # OIDC token proving the results come from this workflow (publish_results)
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
