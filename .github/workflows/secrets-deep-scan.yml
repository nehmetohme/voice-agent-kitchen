# Weekly TruffleHog scan of the full git history (every branch and tag), verified secrets only.
# Fast, offline gitleaks scans run on every commit (lefthook) and PR (ci.yml `repo` job);
# GitHub push protection is the server-side backstop.
name: secrets-deep-scan

on:
  schedule:
    - cron: "13 5 * * 0" # Sundays 05:13 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-deep-scan
  cancel-in-progress: false

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On schedule and workflow_dispatch the action scans the whole history and fails on any
      # result. `version` pins the scanner image (tag + digest) instead of `latest`.
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: 3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
          extra_args: --results=verified
